<meta charset="utf-8">
<title>鹈鹕海岸骑行</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Rubik:wght@500;700;800&display=swap">
<style>
/* Layout: full-bleed WebGL canvas, HUD floats in the four corners, overlays centered. Single dark "night road" look by choice. */
:root{
  --ink:#fff7ec; --ink-dim:#d9c9b6; --glass:rgba(18,16,30,.58); --glass-hi:rgba(34,28,52,.78);
  --scarf:#e0302b; --beak:#ffb03a; --sea:#3fc6d9; --gold:#ffd54a; --line:rgba(255,240,220,.16);
  --f-display:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0a14;color:var(--ink);font-family:var(--f-body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.45) 100%)}
#pov{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;background:rgba(6,4,2,.94);
  -webkit-mask:radial-gradient(ellipse 33% 44% at 29% 50%,transparent 88%,#000 93%),radial-gradient(ellipse 33% 44% at 71% 50%,transparent 88%,#000 93%);
  -webkit-mask-composite:source-in;mask:radial-gradient(ellipse 33% 44% at 29% 50%,transparent 88%,#000 93%),radial-gradient(ellipse 33% 44% at 71% 50%,transparent 88%,#000 93%);
  mask-composite:intersect}
#pov.on{opacity:1}
body::before,body::after{content:"";position:fixed;left:0;right:0;height:0;background:#000;z-index:4;pointer-events:none;transition:height .6s ease}
body::before{top:0}body::after{bottom:0}
body.cine::before,body.cine::after{height:9vh}
.hud{position:fixed;pointer-events:none;z-index:5;font-variant-numeric:tabular-nums}
.panel{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px}
#stats{top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));padding:10px 14px;display:grid;
  grid-template-columns:auto auto;gap:2px 14px;align-items:baseline;min-width:170px}
#stats .big{grid-column:1/-1;font:800 34px/1 var(--f-num);letter-spacing:-.5px}
#stats .big small{font:500 13px var(--f-num);color:var(--ink-dim);margin-left:4px}
#stats label{font-size:11px;letter-spacing:.08em;color:var(--ink-dim)}
#stats b{font:700 15px var(--f-num);text-align:right}
#cad{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden;margin:2px 0 4px}
#cad i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sea),var(--beak));transition:width .2s}
#right{top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#score{padding:8px 14px;text-align:right}
#score .n{font:800 30px/1 var(--f-num);color:var(--gold)}
#score .n::before{content:"🐟 ";font-size:20px}
#combo{font:700 14px var(--f-num);color:var(--beak);min-height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{padding:4px 10px;border-radius:99px;font-size:12px;background:var(--glass);border:1px solid var(--line);white-space:nowrap}
.chip.auto{background:rgba(63,198,217,.25);border-color:var(--sea);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.55}}
.btn{pointer-events:auto;cursor:pointer;font:600 13px var(--f-body);color:var(--ink);padding:7px 12px;border-radius:10px;
  background:var(--glass-hi);border:1px solid var(--line)}
.btn:hover{border-color:var(--beak)}
.btn:focus-visible{outline:2px solid var(--beak);outline-offset:2px}
#help{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:7px 14px;font-size:12px;color:var(--ink-dim);
  white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#help kbd{font:700 11px var(--f-num);color:var(--ink);background:rgba(255,255,255,.12);padding:1px 5px;border-radius:4px;margin:0 1px}
#toasts{top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:9}
.toast{display:flex;gap:10px;align-items:center;padding:9px 16px 9px 10px;border-radius:14px;background:linear-gradient(120deg,rgba(60,30,10,.88),rgba(30,20,50,.88));
  border:1px solid var(--gold);box-shadow:0 6px 30px rgba(255,180,60,.3);animation:tin .5s cubic-bezier(.2,1.4,.4,1),tout .5s 3.3s forwards}
.toast .ic{font-size:26px}.toast b{display:block;font:15px var(--f-display);color:var(--gold)}.toast span{font-size:12px;color:var(--ink-dim)}
@keyframes tin{from{transform:translateY(-30px) scale(.8);opacity:0}}
@keyframes tout{to{transform:translateY(-20px);opacity:0}}
#pops{inset:0}
.pop{position:absolute;font:800 20px var(--f-num);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);animation:popup 1s ease-out forwards;white-space:nowrap}
.pop.gold{color:var(--gold);font-size:26px}.pop.bad{color:#ff7a6a}
@keyframes popup{from{transform:translate(-50%,0) scale(.6);opacity:1}30%{transform:translate(-50%,-20px) scale(1.15)}to{transform:translate(-50%,-70px) scale(1);opacity:0}}
/* overlays */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding-block:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 30%,rgba(255,120,60,.25),transparent 60%),rgba(8,6,16,.62);backdrop-filter:blur(3px)}
.card{max-width:560px;width:100%;max-height:calc(100% - 8px);overflow:auto;padding:26px 26px 22px;border-radius:22px;background:rgba(20,16,34,.9);border:1px solid var(--line);box-shadow:0 20px 80px rgba(0,0,0,.5)}
.card h1{margin:0;font:400 clamp(34px,7vw,52px)/1.05 var(--f-display);text-wrap:balance;
  background:linear-gradient(100deg,var(--beak),#ff7a45 40%,var(--scarf));-webkit-background-clip:text;background-clip:text;color:transparent}
.card .sub{margin:8px 0 18px;color:var(--ink-dim);font-size:14px;line-height:1.6}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;margin:0 0 20px;font-size:13px}
.keys div{display:flex;gap:8px;align-items:center}
.keys kbd{font:700 12px var(--f-num);min-width:26px;text-align:center;padding:3px 6px;border-radius:6px;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.go{width:100%;font:22px var(--f-display);padding:14px;border-radius:14px;border:0;cursor:pointer;color:#2a1200;
  background:linear-gradient(100deg,var(--gold),var(--beak));box-shadow:0 8px 30px rgba(255,170,60,.35)}
.go:hover{filter:brightness(1.08)}.go:focus-visible{outline:3px solid #fff;outline-offset:3px}
.tiny{margin-top:12px;font-size:12px;color:var(--ink-dim);text-align:center}
#achGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);min-width:0}
.ach .ic{font-size:26px;filter:grayscale(1) opacity(.4)}
.ach b{display:block;font:14px var(--f-display)}.ach span{display:block;font-size:11px;color:var(--ink-dim);line-height:1.35}
.ach.on{border-color:var(--gold);background:rgba(255,213,74,.1)}.ach.on .ic{filter:none}
.card h2{margin:0;font:400 30px var(--f-display);color:var(--gold)}
/* touch */
#touch{position:fixed;inset:auto 0 0 0;z-index:6;display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
body.touch #touch{display:flex}
body.touch #help{display:none}
.tpad{display:grid;gap:10px;pointer-events:auto}
.tpad.l{grid-template-columns:repeat(2,64px)}
.tpad.r{grid-template-columns:repeat(3,60px)}
.tb{height:60px;border-radius:18px;background:rgba(20,16,34,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font:700 22px var(--f-num);
  display:grid;place-items:center;backdrop-filter:blur(6px);touch-action:none}
.tb.on{background:rgba(255,176,58,.5);border-color:var(--beak)}
.tb small{font-size:10px;display:block;font-weight:500;margin-top:-4px}
@media (max-width:620px){#stats{min-width:0;padding:8px 10px}#stats .big{font-size:26px}#score .n{font-size:24px}
  .chips .chip.hide-s{display:none}}
@media (prefers-reduced-motion:reduce){.toast,.pop,.chip.auto{animation-duration:.01s}}
</style>

<canvas id="scene" aria-label="鹈鹕骑自行车 3D 场景"></canvas>
<div class="vignette"></div>
<div id="pov"></div>

<div id="stats" class="hud panel">
  <div class="big"><span id="spd">0</span><small>km/h</small></div>
  <div id="cad"><i></i></div>
  <label>踏频</label><b id="rpm">0 rpm</b>
  <label>里程</label><b id="dist">0 m</b>
  <label>时间</label><b id="clock">18:30</b>
</div>

<div id="right" class="hud">
  <div id="score" class="panel"><div class="n" id="fish">0</div><div id="combo"></div></div>
  <div class="chips">
    <span class="chip" id="camName">追尾镜头</span>
    <span class="chip hide-s" id="qual">画质 高</span>
    <span class="chip auto" id="autoChip" hidden>自动驾驶</span>
  </div>
  <div class="chips">
    <button class="btn" id="btnAch" type="button">🏆 <span id="achCount">0</span>/14</button>
    <button class="btn" id="btnCam" type="button">🎥 镜头</button>
    <button class="btn" id="btnMute" type="button">🔊</button>
  </div>
</div>

<div id="toasts" class="hud"></div>
<div id="pops" class="hud"></div>

<div id="help" class="hud panel">
  <kbd>W</kbd><kbd>S</kbd> 加减速 · <kbd>A</kbd><kbd>D</kbd> 变道 · <kbd>空格</kbd> 跳 · <kbd>T</kbd> 展翅抬前轮 · <kbd>C</kbd>/<kbd>1-5</kbd> 镜头 · <kbd>H</kbd> 成就 · <kbd>M</kbd> 静音
</div>

<div id="touch">
  <div class="tpad l">
    <div class="tb" data-k="left">◀</div><div class="tb" data-k="right">▶</div>
  </div>
  <div class="tpad r">
    <div class="tb" data-k="wing">🪽<small>展翅</small></div>
    <div class="tb" data-k="up">▲<small>加速</small></div>
    <div class="tb" data-k="jump">⤒<small>跳</small></div>
    <div class="tb" data-k="cam">🎥</div>
    <div class="tb" data-k="down">▼<small>刹车</small></div>
    <div class="tb" data-k="ach">🏆</div>
  </div>
</div>

<div id="start" class="overlay">
  <div class="card">
    <h1>鹈鹕海岸骑行</h1>
    <p class="sub">戴头盔、架墨镜、红围巾迎风飘的鹈鹕，沿着海岸公路一路追鱼。太阳正落进海里，接下来是星空和月亮。放开按键，它会自己去追鱼。</p>
    <div class="keys">
      <div><kbd>W</kbd><kbd>S</kbd>加速 / 刹车</div>
      <div><kbd>A</kbd><kbd>D</kbd>变道抓鱼</div>
      <div><kbd>空格</kbd>跳跃（高处的鱼）</div>
      <div><kbd>T</kbd>展翅 · 抬前轮 · 滑翔</div>
      <div><kbd>C</kbd><kbd>1-5</kbd>切换镜头</div>
      <div><kbd>H</kbd>成就 <kbd>M</kbd>静音</div>
    </div>
    <button class="go" id="go" type="button">出发 🚲</button>
    <div class="tiny">音乐与音效由浏览器实时合成，节奏跟随踏频 · 画质按帧率自动调整</div>
  </div>
</div>

<div id="achPanel" class="overlay" hidden>
  <div class="card">
    <h2>成就</h2>
    <div id="achGrid"></div>
    <button class="go" id="achClose" type="button">继续骑行</button>
  </div>
</div>

<script src="js/fish.js"></script>
